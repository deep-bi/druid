# Lints the Docker image workflow and runs the unit tests of its scripts.

name: "Deepbi Docker Image Checks"

on:
  pull_request:
    paths:
      - ".github/workflows/deepbi-docker-image*.yml"
      - ".github/scripts/docker-image/**"
      - ".github/scripts/package-contrib-extensions.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Shellcheck
        run: |
          shellcheck --external-sources --source-path=SCRIPTDIR \
            .github/scripts/docker-image/*.sh \
            .github/scripts/docker-image/tests/*.sh \
            .github/scripts/docker-image/tests/fake-bin/* \
            .github/scripts/package-contrib-extensions.sh

      - name: Unit tests
        run: bash .github/scripts/docker-image/tests/run-tests.sh

      # The ignores cover syntax newer than this actionlint release: concurrency queue and the
      # job.workflow_* context of reusable workflows.
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            -ignore 'property "workflow_(repository|sha)" is not defined' \
            .github/workflows/deepbi-docker-image.yml \
            .github/workflows/deepbi-docker-image-checks.yml
