name: "Deepbi Unit Tests Workflow"

on:
  workflow_dispatch:
    inputs:
      jdk:
        description: "JDK to test with; recommended uses the release line's default"
        required: false
        type: choice
        default: recommended
        options:
          - recommended
          - "8"
          - "11"
          - "17"
  pull_request:
    branches:
      - 'deep/**'
    paths-ignore:
      - '**/*.md'
      - 'dev/**'
      - 'docs/**'
      - 'examples/**/jupyter-notebooks/**'
      - 'web-console/**'
      - 'website/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: "unit tests (${{ matrix.name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: C
            letters: C
          - name: H-U-V
            letters: HUV
          - name: N-Q-S
            letters: NQS
          - name: B-O-R
            letters: BOR
          - name: G-J-K
            letters: GJK
          - name: F-L-M
            letters: FLM
          - name: A-D-I-X-Y-Z
            letters: ADIXYZ
          - name: E-P-T-W
            letters: EPTW
          - name: QTest
            tests: 'QTest,QTest$*'
          # Isolate the suite involved in the Surefire memory failure.
          # The larger heap is for Maven/Surefire's controller process.
          - name: TopNQueryRunnerTest
            tests: 'TopNQueryRunnerTest,TopNQueryRunnerTest$*'
            maven_heap: 4g

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve JDK, Maven projects and test selection
        id: resolve
        env:
          REQUESTED_JDK: ${{ inputs.jdk || 'recommended' }}
          LETTERS: ${{ matrix.letters }}
          EXPLICIT_TESTS: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          major="${version%%.*}"

          # Preserve the existing release-line JDK policy.
          case "$major" in
            31)    supported="8 11 17"; recommended=17 ;;
            34)    supported="11 17";   recommended=17 ;;
            36|37) supported="17 21";   recommended=17 ;;
            38)    supported="21 25";   recommended=21 ;;
            *)
              echo "::error::No JDK table for Druid $version; add it to this workflow"
              exit 1
              ;;
          esac

          if [[ "$REQUESTED_JDK" == recommended ]]; then
            jdk="$recommended"
          elif [[ " $supported " == *" $REQUESTED_JDK "* ]]; then
            jdk="$REQUESTED_JDK"
          else
            echo "::error::Druid $version supports JDK $supported, not $REQUESTED_JDK"
            exit 1
          fi

          excludes=()
          for module in integration-tests integration-tests-ex/tools integration-tests-ex/image integration-tests-ex/cases; do
            if [[ -f "$module/pom.xml" ]]; then
              excludes+=("!$module")
            fi
          done

          if [[ -n "$EXPLICIT_TESTS" ]]; then
            tests="$EXPLICIT_TESTS"
          else
            [[ "$LETTERS" =~ ^[A-Z]+$ ]]
            patterns=()
            for ((i=0; i<${#LETTERS}; i++)); do
              letter="${LETTERS:i:1}"
              # Use normal Surefire test naming conventions, rather than C*, I*, etc.
              # Preserve nested classes, which Druid explicitly enables in its POM.
              for suffix in Test Tests TestCase; do
                patterns+=("${letter}*${suffix}" "${letter}*${suffix}\$*")
              done
            done
            # Surefire also recognizes names starting with Test; they belong to T.
            if [[ "$LETTERS" == *T* ]]; then
              patterns+=('Test*')
            fi
            # These suites run only in their dedicated shards, including nested classes.
            patterns+=('!QTest' '!QTest$*' '!TopNQueryRunnerTest' '!TopNQueryRunnerTest$*')
            tests=$(IFS=,; echo "${patterns[*]}")
          fi

          echo "Druid $version, JDK $jdk"
          echo "Selected tests: $tests"
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
          echo "projects=$(IFS=,; echo "${excludes[*]:-}")" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.resolve.outputs.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.resolve.outputs.jdk }}
          cache: maven

      - name: Run unit tests
        env:
          TESTS: ${{ steps.resolve.outputs.tests }}
          PROJECTS: ${{ steps.resolve.outputs.projects }}
          # This controls Maven, not the forked JVM's POM-defined heap.
          MAVEN_OPTS: >-
            -Xmx${{ matrix.maven_heap || '3g' }}
            -XX:+HeapDumpOnOutOfMemoryError
            -XX:HeapDumpPath=${{ runner.temp }}/maven.hprof
        run: |
          set -euo pipefail
          args=(
            -B test
            -P skip-static-checks
            -Dweb.console.skip=true
            -Djacoco.skip=true
            -Dsurefire.failIfNoSpecifiedTests=false
            -Dsurefire.trimStackTrace=false
            -DforkCount=1
            "-Dtest=$TESTS"
            -fae
          )
          if [[ -n "$PROJECTS" ]]; then
            args+=(-pl "$PROJECTS")
          fi
          mvn "${args[@]}"

      - name: Upload test reports and crash diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-jdk${{ steps.resolve.outputs.jdk }}-${{ matrix.name }}
          path: |
            **/target/surefire-reports/**
            **/hs_err_pid*
            **/*.hprof
            ${{ runner.temp }}/maven.hprof
          if-no-files-found: ignore
          retention-days: 14

  unit-tests-result:
    name: "unit tests result"
    if: ${{ always() }}
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check unit test shards
        env:
          RESULT: ${{ needs.unit-tests.result }}
        run: |
          if [[ "$RESULT" != success ]]; then
            echo "::error::Unit test shards finished with status: $RESULT"
            exit 1
          fi
